server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed build assets: cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker must revalidate so new builds propagate.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    expires 0;
  }

  # SPA fallback; index.html revalidated on every load.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
